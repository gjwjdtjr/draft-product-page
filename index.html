<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오브제 트루베 파운데이션 상세페이지</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #f8f8f8;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .detail-container {
      width: 100%;
      max-width: 800px; /* 상세페이지 최대 너비 설정 */
      background: #ffffff;
    }
    .detail-container img {
      width: 100%;
      display: block; /* 이미지 사이 여백 제거 */
      height: auto;
    }
  </style>
</head>
<body>
  <div class="detail-container">
    <!-- 업로드한 이미지 파일명에 맞게 src 수정 -->
    <img src="p1.jpg" alt="마이비타C 상세페이지_1">
    <img src="GIF1.gif" alt="3000%">
    <img src="p2.jpg" alt="마이비타C 상세페이지_2">
  </div>
</body>
</html>
